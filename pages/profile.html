<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disc golf site</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="/javascript/components.js"></script>
    <script src="/javascript/search.js" defer></script>
</head>

<body>

    <!-- NAVBAR -->
   <div id="navbar"></div>

    <!-- MAIN PAGE CONTENT -->
    <div class="profile-page">

    <!-- TOP PROFILE CARD -->
    <div class="profile-hero">

        <div class="profile-avatar">
            👤
        </div>

        <div class="profile-info">
            <h1>John Doe</h1>

            <p>Disc Golfer • Michigan</p>

            <div class="profile-stats">

                <div class="stat">
                    <h2>42</h2>
                    <p>Rounds</p>
                </div>

                <div class="stat">
                    <h2>12</h2>
                    <p>Aces</p>
                </div>

                <div class="stat">
                    <h2>914</h2>
                    <p>Rating</p>
                </div>

            </div>
        </div>

    </div>

    <!-- FAVORITE DISCS -->
    <div class="profile-section">

        <h2>Favorite Discs</h2>

        <div class="profile-grid">

            <div class="disc-card">
                <h3>Destroyer</h3>
                <p>Distance Driver</p>
            </div>

            <div class="disc-card">
                <h3>Buzzz</h3>
                <p>Midrange</p>
            </div>

            <div class="disc-card">
                <h3>Judge</h3>
                <p>Putter</p>
            </div>

        </div>

    </div>

    <!-- RECENT COURSES -->
    <div class="profile-section">

        <h2>Recent Courses</h2>

        <div class="profile-grid">

            <div class="course-card">
                <h3>Ross Park</h3>
                <p>Norton Shores, MI</p>
            </div>

            <div class="course-card">
                <h3>Flip City</h3>
                <p>Shelby, MI</p>
            </div>

        </div>

    </div>

</div>

    <!-- FOOTER -->
    <div id="footer"></div>
    
</body>

</html>
